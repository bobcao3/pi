name: Fork artifacts

on:
  push:
    branches: ["cpi-fork"]
    tags: ["cpi-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts
      - name: Test archive closure and release safety
        run: node --test scripts/fork-release.test.mjs
      - name: Check package dependency boundaries
        run: |
          npm run check:pinned-deps
          npm run check:runtime-deps
          npm run check:ts-imports
          npm run check:entry-graphs
          npm run check:install-lock:coding-agent
      - name: Produce versioned fork packages
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/pi-artifacts
        run: |
          version=$(node scripts/publish-fork-release.mjs version)
          upstream=$(node -p 'require("./fork.json").upstreamRevision')
          node scripts/produce-artifacts.mjs "$ARTIFACT_DIRECTORY" "$version" "$upstream"
      - name: Test installed SDK and CLI with npm and Bun
        run: node scripts/verify-fork-artifacts.mjs "${{ runner.temp }}/pi-artifacts"
      - name: Close tagged archive dependencies over immutable release URLs
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RAW_DIRECTORY: ${{ runner.temp }}/pi-artifacts
          CLOSED_DIRECTORY: ${{ runner.temp }}/pi-release
        run: |
          node scripts/close-fork-artifacts.mjs "$RAW_DIRECTORY" "$CLOSED_DIRECTORY" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: pi-fork-release
          path: ${{ runner.temp }}/pi-release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pi-fork-packages
          path: |
            ${{ runner.temp }}/pi-artifacts/*.tgz
            ${{ runner.temp }}/pi-artifacts/manifest.json
            ${{ runner.temp }}/pi-artifacts/verification.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: actions/download-artifact@v4
        with:
          name: pi-fork-release
          path: ${{ runner.temp }}/pi-release
      - name: Publish and verify durable public bytes without overwriting assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-fork-release.mjs publish "${{ runner.temp }}/pi-release"

  sync-cpi-pin:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Mint a token restricted to cpi release dispatch
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CPI_PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CPI_PIN_APP_PRIVATE_KEY }}
          owner: bobcao3
          repositories: cpi
          permission-contents: write
      - name: Notify cpi with the short-lived GitHub App token
        env:
          CPI_PIN_UPDATE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/dispatch-cpi-pin-update.mjs
